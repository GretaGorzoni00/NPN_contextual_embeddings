<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PCA Visualizations</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      text-align: center;
    }

    .buttons {
      text-align: center;
      margin: 20px 0;
    }

    button {
      padding: 10px 16px;
      margin: 5px;
      font-size: 15px;
      cursor: pointer;
    }

    iframe {
      width: 100%;
      height: 700px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<h1>PCA Visualizations of Contextual Embeddings</h1>

<div class="buttons">
  <button onclick="loadPCA('pca_unk.html')">[UNK]</button>
  <button onclick="loadPCA('pca_prep.html')">PREP</button>
  <button onclick="loadPCA('pca_cls.html')">CLS</button>
</div>

<iframe id="viewer" src="pca_unk.html"></iframe>

<script>
  function loadPCA(page) {
    document.getElementById("viewer").src = page;
  }
</script>

</body>
</html>
